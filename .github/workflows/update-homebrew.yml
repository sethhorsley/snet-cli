name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to update to (e.g. v1.0.0)"
        required: true

jobs:
  update-formula:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest

    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_no_v=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download SHA256 checksums
        run: |
          BASE="https://github.com/sethhorsley/snet-cli/releases/download/${{ steps.version.outputs.version }}"
          curl -fsSL "$BASE/snet-darwin-arm64.tar.gz.sha256" -o darwin-arm64.sha256
          curl -fsSL "$BASE/snet-darwin-amd64.tar.gz.sha256" -o darwin-amd64.sha256
          curl -fsSL "$BASE/snet-linux-arm64.tar.gz.sha256"  -o linux-arm64.sha256
          curl -fsSL "$BASE/snet-linux-amd64.tar.gz.sha256"  -o linux-amd64.sha256

      - name: Extract SHA256 values
        id: sha
        run: |
          echo "darwin_arm64=$(awk '{print $1}' darwin-arm64.sha256)" >> $GITHUB_OUTPUT
          echo "darwin_amd64=$(awk '{print $1}' darwin-amd64.sha256)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(awk '{print $1}'  linux-arm64.sha256)"  >> $GITHUB_OUTPUT
          echo "linux_amd64=$(awk '{print $1}'  linux-amd64.sha256)"  >> $GITHUB_OUTPUT

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: sethhorsley/homebrew-tap
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Write updated formula
        env:
          VERSION:      ${{ steps.version.outputs.version }}
          VERSION_NO_V: ${{ steps.version.outputs.version_no_v }}
          DA_ARM64:     ${{ steps.sha.outputs.darwin_arm64 }}
          DA_AMD64:     ${{ steps.sha.outputs.darwin_amd64 }}
          LX_ARM64:     ${{ steps.sha.outputs.linux_arm64 }}
          LX_AMD64:     ${{ steps.sha.outputs.linux_amd64 }}
        run: |
          cat > tap/Formula/snet.rb <<FORMULA
          class Snet < Formula
            desc "Secure HTTPS tunnels from localhost to public URLs"
            homepage "https://github.com/sethhorsley/snet-cli"
            version "${VERSION_NO_V}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/sethhorsley/snet-cli/releases/download/${VERSION}/snet-darwin-arm64.tar.gz"
                sha256 "${DA_ARM64}"
              else
                url "https://github.com/sethhorsley/snet-cli/releases/download/${VERSION}/snet-darwin-amd64.tar.gz"
                sha256 "${DA_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/sethhorsley/snet-cli/releases/download/${VERSION}/snet-linux-arm64.tar.gz"
                sha256 "${LX_ARM64}"
              else
                url "https://github.com/sethhorsley/snet-cli/releases/download/${VERSION}/snet-linux-amd64.tar.gz"
                sha256 "${LX_AMD64}"
              end
            end

            def install
              bin.install "snet"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/snet version")
            end
          end
          FORMULA

          # Strip the leading whitespace that heredoc indentation adds
          sed -i 's/^          //' tap/Formula/snet.rb

      - name: Commit and push to tap
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/snet.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date, nothing to commit"
          else
            git commit -m "snet ${{ steps.version.outputs.version }}"
            git push
          fi
